<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电子健康证查询</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background-color: #f5f5f5;
      padding-bottom: 60px;
    }

    .page-header {
      background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
      color: #fff;
      text-align: center;
      padding: 16px 10px 14px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .page-header .subtitle {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 4px;
      font-weight: 400;
    }

    .cardpic {
      min-width: 350px;
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      margin: 12px 10px;
    }

    .section-label {
      font-size: 13px;
      color: #666;
      text-align: center;
      padding: 8px 0 4px;
      letter-spacing: 2px;
    }

    .cardinfo {
      display: flex;
      justify-content: center;
      margin: 15px 0 0 0;
      font-size: 12px;
      background-color: #fff;
    }
    .cardinfo .card {
      width: 350px;
      height: 230px;
      position: relative;
      background-color: #f5f5f5;
      border: 1px solid #d4d4d4;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cardinfo .card .frontImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #fff;
    }
    .cardinfo .card .frontImg.active { display: block; }
    .cardinfo .card .frontImg-placeholder {
      color: #999;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }

    .cardinfo-r {
      display: flex;
      justify-content: center;
      margin: 5px 0 20px 0;
      font-size: 12px;
      background-color: #fff;
    }
    .cardinfo-r .card-r {
      width: 350px;
      height: 220px;
      position: relative;
      border: 1px solid #d4d4d4;
      border-radius: 10px;
      background-color: #fff;
    }
    .cardinfo-r .card-r .top {
      position: absolute;
      top: 0;
      width: 100%;
      background-color: #4a90d9;
      line-height: 6px;
      border-radius: 10px 10px 0 0;
      color: #fff;
    }
    .cardinfo-r .card-r .title {
      text-align: center;
      font-weight: 600;
      line-height: 40px;
      padding-top: 12px;
      font-size: 18px;
      word-spacing: 3px;
      color: #030101;
    }
    .cardinfo-r .card-r .card-ctx {
      display: flex;
      height: 100px;
      width: 100%;
      align-items: center;
    }
    .cardinfo-r .card-r .card-ctx #qrcode {
      width: 80px;
      height: 80px;
      text-align: center;
      padding: 0 10px 10px 10px;
      margin-left: 10px;
      font-size: 12px;
      display: inline-block;
    }
    .cardinfo-r .card-r .card-ctx #qrcode img,
    .cardinfo-r .card-r .card-ctx #qrcode canvas {
      width: 80px !important;
      height: 80px !important;
    }
    .cardinfo-r .card-r .card-ctx .card-ctx-desc {
      width: calc(100% - 80px);
      line-height: 25px;
      padding: 5px;
      margin-top: 0;
      color: #030101;
      font-weight: 545;
      font-size: 14px;
      text-align: center;
    }
    .cardinfo-r .card-r .sign {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 12px;
      height: 30px;
    }
    .cardinfo-r .card-r .bottom {
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
      background-color: #fff;
      line-height: 25px;
      border-radius: 0 0 10px 10px;
      color: #030101;
      font-size: 12px;
    }

    .btn-orange {
      display: block;
      text-align: center;
      background-color: #eba753;
      color: #fff;
      height: 40px;
      line-height: 40px;
      border-radius: 10px;
      width: calc(100% - 80px);
      margin: 0 auto 10px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-blue {
      display: block;
      text-align: center;
      background-color: #5bc0de;
      color: #fff;
      height: 40px;
      line-height: 40px;
      border-radius: 10px;
      width: calc(100% - 80px);
      margin: 0 auto 10px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    .page-foot {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      height: 50px;
      line-height: 50px;
      border-top: 1px solid #f2f2f2;
      text-align: center;
      background-color: #fff;
      font-size: 13px;
      z-index: 100;
    }
    .page-foot div {
      width: 50%;
      border-right: 1px solid #f2f2f2;
      cursor: pointer;
      color: #333;
    }
    .page-foot div:last-child { border-right: 0; }

    /* ====== 密码弹窗 ====== */
    .pwd-overlay {
      display: none;
      position: fixed;
      z-index: 9998;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background-color: rgba(0,0,0,0.5);
    }
    .pwd-overlay.active { display: flex; align-items: center; justify-content: center; }
    .pwd-dialog {
      background: #fff;
      width: 300px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      text-align: center;
    }
    .pwd-dialog .pwd-header {
      background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
      color: #fff;
      padding: 18px 20px;
      font-size: 16px;
      font-weight: 500;
    }
    .pwd-dialog .pwd-body { padding: 24px 20px 10px; }
    .pwd-dialog .pwd-body input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d4d4d4;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      outline: none;
      letter-spacing: 4px;
    }
    .pwd-dialog .pwd-body input:focus { border-color: #4a90d9; }
    .pwd-dialog .pwd-body .pwd-error {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .pwd-dialog .pwd-footer {
      display: flex;
      border-top: 1px solid #eee;
    }
    .pwd-dialog .pwd-footer button {
      flex: 1;
      height: 44px;
      border: none;
      background: none;
      font-size: 15px;
      cursor: pointer;
    }
    .pwd-dialog .pwd-footer .pwd-cancel { color: #999; border-right: 1px solid #eee; }
    .pwd-dialog .pwd-footer .pwd-confirm { color: #4a90d9; font-weight: 600; }

    /* ====== 编辑弹窗 ====== */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 9999;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background-color: rgba(0,0,0,0.45);
      overflow-y: auto;
      padding: 20px 0;
    }
    .modal-overlay.active { display: block; }

    .modal-panel {
      display: none;
      background: #fff;
      width: 90%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: 12px;
      padding: 0 0 20px 0;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      position: relative;
    }
    .modal-overlay.active .modal-panel { display: block; }

    .modal-header {
      background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 16px; font-weight: 500; }
    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .modal-body { padding: 16px 20px; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d4d4d4;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: #4a90d9;
    }
    .form-group .avatar-preview {
      width: 80px;
      height: 96px;
      border-radius: 5px;
      border: 1px dashed #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
      background: #f9f9f9;
    }
    .form-group .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .form-group .upload-hint {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    .form-group input[type="file"] {
      padding: 6px 0;
      font-size: 12px;
      border: none;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .btn-save {
      flex: 1;
      background: #4a90d9;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-save:hover { background: #357abd; }
    .btn-reset {
      flex: 0 0 auto;
      background: #f0f0f0;
      color: #666;
      border: 1px solid #d4d4d4;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-reset:hover { background: #e0e0e0; }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 99999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    a { text-decoration: none; }

    @media (max-width: 380px) {
      .cardinfo .card,
      .cardinfo-r .card-r {
        width: 310px;
        height: 195px;
        transform: scale(0.88);
        transform-origin: top center;
        margin-bottom: -20px;
      }
      .cardinfo .card { height: 205px; }
      .cardinfo-r .card-r { margin-bottom: 0; }
    }
  </style>
</head>
<body>

  <div class="page-header">
    电子健康证查询
    <div class="subtitle">从业人员健康合格证明</div>
  </div>

  <section class="cardpic" id="cardpic">
    <div class="cardinfo">
      <div class="card" id="frontCard">
        <img class="frontImg" id="frontImg" src="" alt="正面健康证" />
        <div class="frontImg-placeholder" id="frontImgPlaceholder">点击"体检预约"<br>上传正面健康证图片</div>
      </div>
    </div>

    <div class="cardinfo-r">
      <div class="card-r">
        <div class="top"></div>
        <div class="title">健康合格证明</div>
        <div class="card-ctx">
          <div id="qrcode"></div>
          <div class="card-ctx-desc">
            扫码查看电子健康证<br>
            广州市增城区新塘医院制
          </div>
        </div>
        <div class="sign"></div>
        <div class="bottom">本证明仅限本人使用</div>
      </div>
    </div>
  </section>

  <a href="javascript:void(0)" class="btn-orange" onclick="showToast('功能开发中')">申请邮寄</a>
  <a href="javascript:void(0)" class="btn-blue" onclick="showToast('功能开发中')">绑定身份获取通知</a>

  <div class="page-foot">
    <div id="btnAppointment">体检预约</div>
    <div onclick="showToast('功能开发中')">医院介绍</div>
  </div>

  <!-- 密码弹窗 -->
  <div class="pwd-overlay" id="pwdOverlay">
    <div class="pwd-dialog">
      <div class="pwd-header">管理验证</div>
      <div class="pwd-body">
        <input type="password" id="pwdInput" placeholder="请输入管理密码" maxlength="20" />
        <div class="pwd-error" id="pwdError">密码错误，请重试</div>
      </div>
      <div class="pwd-footer">
        <button class="pwd-cancel" onclick="closePwdModal()">取消</button>
        <button class="pwd-confirm" onclick="verifyPassword()">确认</button>
      </div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-panel" id="modalPanel">
      <div class="modal-header">
        <h3>编辑健康证信息</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>正面健康证图片（一键上传）</label>
          <div class="avatar-preview" id="avatarPreview" style="width:100%;height:160px;">
            <img id="avatarPreviewImg" src="" alt="预览" style="display:none;max-width:100%;max-height:100%;object-fit:contain;" />
            <span id="avatarPlaceholder" style="color:#ccc;font-size:13px;">点击上传图片</span>
          </div>
          <input type="file" id="avatarInput" accept="image/*" onchange="handleAvatarUpload(event)" />
          <div class="upload-hint">支持JPG/PNG，上传后整张正面卡片显示此图</div>
        </div>
        <div class="btn-row">
          <button class="btn-save" onclick="saveData()">保存修改</button>
          <button class="btn-reset" onclick="resetData()">恢复默认</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    function loadData() {
      // 优先从 localStorage 读取（本地修改后的最新数据）
      try {
        var raw = localStorage.getItem('healthcard_data');
        if (raw) {
          var saved = JSON.parse(raw);
          if (saved.avatar) return { avatar: saved.avatar };
        }
      } catch(e) {}
      // 回退到 HTML 内置的 DEFAULT_IMAGE（服务器推送后的数据）
      if (DEFAULT_IMAGE) return { avatar: DEFAULT_IMAGE };
      return { avatar: '' };
    }

    function saveToStorage(data) {
      localStorage.setItem('healthcard_data', JSON.stringify(data));
    }

    function applyDataToPage(data) {
      var img = document.getElementById('frontImg');
      var placeholder = document.getElementById('frontImgPlaceholder');
      if (data.avatar) {
        img.src = data.avatar;
        img.classList.add('active');
        placeholder.style.display = 'none';
      } else {
        img.classList.remove('active');
        placeholder.style.display = 'block';
      }
    }

    function fillForm(data) {
      var previewImg = document.getElementById('avatarPreviewImg');
      var placeholder = document.getElementById('avatarPlaceholder');
      if (data.avatar) {
        previewImg.src = data.avatar;
        previewImg.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        previewImg.style.display = 'none';
        placeholder.style.display = 'block';
      }
    }

    function handleAvatarUpload(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        var previewImg = document.getElementById('avatarPreviewImg');
        var placeholder = document.getElementById('avatarPlaceholder');
        previewImg.src = e.target.result;
        previewImg.style.display = 'block';
        placeholder.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function saveData() {
      var previewImg = document.getElementById('avatarPreviewImg');
      var avatar = previewImg.style.display !== 'none' ? previewImg.src : '';
      var data = { avatar: avatar };

      // 1. 保存到 localStorage（本地即时生效）
      saveToStorage(data);
      applyDataToPage(data);
      closeModal();

      // 2. 同步到 GitHub（POST 到本地服务器）
      if (avatar) {
        showToast('正在同步到 GitHub Pages...');
        var syncPort = location.port || '3456';
        fetch('http://localhost:' + syncPort + '/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: avatar })
        })
        .then(function(r) { return r.json(); })
        .then(function(result) {
          if (result.ok) {
            showToast(result.note || '保存成功！图片已同步到 GitHub Pages');
          } else {
            showToast('同步失败: ' + (result.error || '未知错误'));
          }
        })
        .catch(function() {
          showToast('⚠ 本地已保存，但无法连接同步服务。请运行 server.js 后重试');
        });
      } else {
        showToast('请先上传图片');
      }
    }

    function resetData() {
      if (confirm('确定要恢复默认数据吗？')) {
        localStorage.removeItem('healthcard_data');
        applyDataToPage(DEFAULT_DATA);
        fillForm(DEFAULT_DATA);
        closeModal();
        showToast('已恢复默认数据');
      }
    }

    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
      fillForm(loadData());
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    /* ====== 密码弹窗逻辑 ====== */
    function openPwdModal() {
      document.getElementById('pwdOverlay').classList.add('active');
      document.getElementById('pwdInput').value = '';
      document.getElementById('pwdError').style.display = 'none';
      setTimeout(function() {
        document.getElementById('pwdInput').focus();
      }, 200);
    }

    function closePwdModal() {
      document.getElementById('pwdOverlay').classList.remove('active');
    }

    function verifyPassword() {
      var input = document.getElementById('pwdInput').value;
      if (input === ADMIN_PASSWORD) {
        closePwdModal();
        openModal();
      } else {
        document.getElementById('pwdError').style.display = 'block';
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdInput').focus();
      }
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
    }

    var qrGenerated = false;
    function generateQR() {
      if (qrGenerated) return;
      qrGenerated = true;
      var container = document.getElementById('qrcode');
      container.innerHTML = '';
      // 始终指向 GitHub Pages（扫码的人看到的应该是线上版本）
      var qrUrl = 'https://2262094142-afk.github.io/health-cert/';
      new QRCode(container, {
        text: qrUrl,
        width: 80,
        height: 80,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      var data = loadData();
      applyDataToPage(data);
      generateQR();

      // 体检预约 → 弹出密码验证
      document.getElementById('btnAppointment').addEventListener('click', openPwdModal);

      // 密码弹窗回车提交
      document.getElementById('pwdInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') verifyPassword();
      });

      // 编辑弹窗关闭
      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });
    });
  </script>
